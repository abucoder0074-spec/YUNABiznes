[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# E501 is intentionally omitted: long SQL/Alembic declarations remain more readable unwrapped.
select = ["E4", "E7", "E9", "F", "I", "UP"]
